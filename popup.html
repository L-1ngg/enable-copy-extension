<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enable Copy</title>
  <style>
    :root {
      --bg: #ffffff;
      color-scheme: light dark;
      --surface: #f6f8f9;
      --border: #e9edef;
      --text: #243331;
      --text-sub: #677572;
      --accent: #168268;
      --active-bg: #edf8f2;
      --track: #c4cecb;
      --warning-bg: #fff5e9;
      --warning-text: #865518;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202423;
        --surface: #292e2d;
        --border: #363e3b;
        --text: #edf3f0;
        --text-sub: #acbab3;
        --accent: #72d8b6;
        --active-bg: #253c32;
        --track: #67756f;
        --warning-bg: #3b3022;
        --warning-text: #edc28b;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; letter-spacing: 0; }
    /* Chrome sizes action popups from their content. Viewport-relative width
       limits create a sizing loop while the popup is first being measured. */
    html, body { width: 320px; min-width: 320px; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    header img {
      width: 32px;
      height: 32px;
      flex: none;
    }
    .title { font-size: 17px; font-weight: 600; line-height: 1.4; white-space: nowrap; }
    .version { font-size: 11px; color: var(--text-sub); font-variant-numeric: tabular-nums; }

    .site { padding: 16px 20px; }
    .site-label { font-size: 12px; font-weight: 400; color: var(--text-sub); }
    .status-sub {
      margin-top: 7px;
      min-height: 21px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 68px;
      padding: 12px 20px;
      background: var(--surface);
      transition: background 0.18s;
    }
    body[data-state="enabled"] .status-row { background: var(--active-bg); }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-sub);
      transition: background 0.18s;
      flex: none;
    }
    .dot.on {
      background: var(--accent);
    }
    .status-text { font-size: 14px; font-weight: 500; line-height: 1.5; flex: 1; white-space: nowrap; }
    body[data-state="enabled"] .status-text { color: var(--accent); }

    /* Switch */
    .switch {
      position: relative;
      width: 48px;
      height: 44px;
      flex: none;
    }
    .switch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
    .slider {
      position: absolute;
      inset: 9px 0;
      cursor: pointer;
      background: var(--track);
      border-radius: 26px;
      pointer-events: none;
      transition: background 0.18s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.18s;
      box-shadow: 0 1px 3px rgba(24, 47, 39, 0.15);
    }
    .switch input:not(:disabled) { cursor: pointer; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(22px); }
    .switch input:disabled + .slider { opacity: 0.45; }
    .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 4px; }

    /* Footer */
    footer {
      padding: 8px 20px;
      min-height: 50px;
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer a {
      color: var(--text-sub);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      border-radius: 4px;
    }
    footer a:hover { color: var(--accent); }
    footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    footer a svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }
    #tab-warning {
      padding: 12px 20px;
      font-size: 12px;
      color: var(--warning-text);
      background: var(--warning-bg);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body data-state="loading">
  <header>
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <h1 class="title">Enable Copy</h1>
  </header>

  <main aria-busy="true" id="main">
    <div class="site">
      <div class="site-label">当前站点</div>
      <div class="status-sub" id="status-sub">正在读取站点</div>
    </div>
    <div class="status-row">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <span class="status-text" id="status-text" role="status">正在读取状态</span>
      <label class="switch">
        <input type="checkbox" role="switch" id="toggle" aria-label="在本站启用强制解除" aria-describedby="status-sub" disabled>
        <span class="slider" aria-hidden="true"></span>
      </label>
    </div>
    <div id="tab-warning" role="alert" hidden>此页面无法连接扩展。普通网页可刷新后重试。</div>
  </main>

  <footer>
    <span class="version">v1.1.0</span>

  </footer>

  <script src="popup.js"></script>
</body>
</html>
